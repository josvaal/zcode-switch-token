name: Build installers

# Native runners per platform: Tauri cannot cross-compile Windows (MSVC) or
# macOS (Xcode) bundles from Linux. Two triggers:
#   - push a tag (v*)  -> builds and PUBLISHES a release with installers
#   - manual dispatch  -> set the "tag" input (e.g. v0.1.0) to publish,
#                         or leave it empty to only build (no release)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Empty = build only, no release."
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (M1+)
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel Macs
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag pushes use the pushed tag; manual dispatch uses the input
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          releaseName: "ZCode Switcher ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          releaseBody: "Installers for Linux (AppImage/deb/rpm), Windows (msi/nsis) and macOS (dmg). Unsigned — expect SmartScreen/Gatekeeper warnings."
          releaseDraft: false
          prerelease: false
          # no auto-updater in this app: skip updater manifests (and the
          # "Signature not found" warning that comes with them)
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
